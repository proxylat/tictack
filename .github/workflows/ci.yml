name: TicTack CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: |
          dotnet restore src/TicTack.csproj
          dotnet restore tests/TicTack.Tests.csproj
      - name: Build application
        run: dotnet build src/TicTack.csproj --configuration Release --no-restore
      - name: Run tests
        run: dotnet test tests/TicTack.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --blame-hang --blame-hang-timeout 180000 --blame-hang-dump-type mini
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ matrix.os }}
          path: tests/TestResults/
          if-no-files-found: ignore

  native-windows:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/TicTack.Tests.csproj
      - name: Run Windows integration tests
        run: dotnet test tests/TicTack.Tests.csproj --configuration Release --no-restore --filter "Category=Windows" --blame-hang --blame-hang-timeout 180000 --blame-hang-dump-type mini
      - name: Upload hang diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hang-dumps-windows
          path: tests/TestResults/
          if-no-files-found: ignore
