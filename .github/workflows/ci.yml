name: TicTack CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Elevated Windows tests self-skip without this (they also need a
  # registered TicTackSv EventLog source + readable Application channel,
  # probed at runtime). Harmless elsewhere: those tests skip off-Windows.
  TICTACK_ELEVATED_TESTS: '1'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: |
          dotnet restore src/TicTack.csproj
          dotnet restore tests/TicTack.Tests.csproj
      - name: Build application
        run: dotnet build src/TicTack.csproj --configuration Release --no-restore
      - name: Register EventLog source for elevated tests
        if: matrix.os == 'windows-latest'
        run: New-EventLog -LogName Application -Source TicTackSv -ErrorAction SilentlyContinue
      - name: Run tests
        shell: bash
        run: |
          # Windows-gated tests early-return on Linux and would report false
          # passes; exclude them on ubuntu so they report skipped instead.
          # (On windows-latest the full suite runs, including Category=Windows.)
          FILTER=""
          if [ "$RUNNER_OS" = "Linux" ]; then FILTER="--filter Category!=Windows"; fi
          # shellcheck disable=SC2086
          dotnet test tests/TicTack.Tests.csproj --configuration Release --no-restore $FILTER --settings tests/coverlet.runsettings --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --blame-hang --blame-hang-timeout 180000 --blame-hang-dump-type mini
      - name: Analyze hang dumps
        if: failure() && matrix.os == 'ubuntu-latest'
        run: |
          shopt -s nullglob globstar
          dumps=(tests/TestResults/**/*.dmp)
          if [ ${#dumps[@]} -eq 0 ]; then echo "no hang dumps"; exit 0; fi
          # dnx (ships with the .NET 10 SDK) runs the tools one-shot without
          # a global install; fall back to a global install otherwise.
          if command -v dnx >/dev/null 2>&1; then
            PSTACKS="dnx dotnet-pstacks"; DDUMP="dnx dotnet-dump"
          else
            dotnet tool install -g dotnet-pstacks dotnet-dump || true
            export PATH="$PATH:$HOME/.dotnet/tools"
            PSTACKS="dotnet-pstacks"; DDUMP="dotnet-dump"
          fi
          for d in "${dumps[@]}"; do
            $PSTACKS "$d" > "${d%.dmp}.pstacks.txt" 2>&1 || true
            $DDUMP analyze "$d" -c threads -c syncblk -c 'clrstack -all' -c exit > "${d%.dmp}.sos.txt" 2>&1 || true
          done
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: tests/TestResults/
          if-no-files-found: ignore

  corpus:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: |
          dotnet restore corpus/Corpus.csproj
          dotnet restore corpus/tests/Corpus.Tests.csproj
      - name: Build application
        run: dotnet build corpus/Corpus.csproj --configuration Release --no-restore
      - name: Run tests
        run: dotnet test corpus/tests/Corpus.Tests.csproj --configuration Release --no-restore

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: semgrep r/csharp
        run: |
          # Pinned: a new rule release must not turn the gate red on its own.
          pipx install 'semgrep==1.177.0'
          semgrep --config r/csharp --metrics off --json -o semgrep.json src corpus
      - name: ast-grep banked rules
        run: |
          npm install -g '@ast-grep/cli@0.45.3'
          ast-grep scan
      - name: Upload semgrep results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: static-results
          path: semgrep.json
          if-no-files-found: ignore

  native-windows:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/TicTack.Tests.csproj
      - name: Register EventLog source for elevated tests
        run: New-EventLog -LogName Application -Source TicTackSv -ErrorAction SilentlyContinue
      - name: Run Windows integration tests
        run: dotnet test tests/TicTack.Tests.csproj --configuration Release --no-restore --filter "Category=Windows" --blame-hang --blame-hang-timeout 180000 --blame-hang-dump-type mini
      - name: Analyze hang dumps
        if: failure()
        shell: pwsh
        run: |
          $dumps = Get-ChildItem -Path tests/TestResults -Recurse -Filter *.dmp -ErrorAction SilentlyContinue
          if (-not $dumps) { Write-Host "no hang dumps"; exit 0 }
          # dnx (ships with the .NET 10 SDK) runs the tools one-shot without
          # a global install; fall back to a global install otherwise.
          if (Get-Command dnx -ErrorAction SilentlyContinue) {
            function Invoke-PStacks { dnx dotnet-pstacks @args }
            function Invoke-DDump { dnx dotnet-dump @args }
          } else {
            dotnet tool install -g dotnet-pstacks dotnet-dump
            $env:PATH = "$env:PATH;$env:USERPROFILE\.dotnet\tools"
            function Invoke-PStacks { dotnet-pstacks @args }
            function Invoke-DDump { dotnet-dump @args }
          }
          foreach ($d in $dumps) {
            $base = $d.FullName.Substring(0, $d.FullName.Length - 4)
            Invoke-PStacks $d.FullName > "$base.pstacks.txt" 2>&1
            Invoke-DDump analyze $d.FullName -c threads -c syncblk -c 'clrstack -all' -c exit > "$base.sos.txt" 2>&1
          }
      - name: Upload hang diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hang-dumps-windows
          path: tests/TestResults/
          if-no-files-found: ignore

  release:
    # Tag push (v*) after green gates: AOT exe + version-stamped .iss
    # installer, attached to the GitHub Release automatically.
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [test, corpus, native-windows]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Publish NativeAOT
        run: |
          dotnet publish src/TicTack.csproj -p:PublishProfile=Aot -o service/win
          Remove-Item service/win/*.dll, service/win/*.runtimeconfig.json, service/win/*.deps.json, service/win/*.pdb -ErrorAction SilentlyContinue
      - name: Stage config and stamp version
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          Copy-Item service/win/config_win.yaml.example service/win/config.yaml
          (Get-Content service/win/setup.iss) -replace '#define MyAppVersion "[^"]*"', "#define MyAppVersion `"$version`"" | Set-Content service/win/setup.iss
      - name: Build installer
        run: |
          choco install innosetup -y
          iscc service/win/setup.iss
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: service/win/TicTackSetup-*.exe
