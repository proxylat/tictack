name: TicTack CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: |
          dotnet restore src/TicTack.csproj
          dotnet restore tests/TicTack.Tests.csproj
      - name: Build application
        run: dotnet build src/TicTack.csproj --configuration Release --no-restore
      - name: Run tests
        run: dotnet test tests/TicTack.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: tests/TestResults/
          if-no-files-found: ignore

  native-windows:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/TicTack.Tests.csproj
      - name: Run Windows integration tests
        run: dotnet test tests/TicTack.Tests.csproj --configuration Release --no-restore --filter "Category=Windows"
